[project]
name = "resplens"
version = "0.1.0"
description = "Reliability-aware AI tools and forecasting benchmark for US respiratory surveillance data"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jiande Wu" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0",
    "mcp>=2.3",
]

[project.scripts]
resplens-mcp = "resplens.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
