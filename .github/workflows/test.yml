name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Runs only in the public repository; the private development repository skips it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest -q
